<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NWS Historical Field Office Mapping Project</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #121824;
      --panel-bg: #1e2638;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-dark); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Control Header */
    header {
      background: var(--panel-bg);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    .brand h1 { font-size: 1.1rem; font-weight: 600; }
    .brand p { font-size: 0.8rem; color: var(--text-muted); }

    .timeline-container {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-grow: 1;
      max-width: 650px;
      margin: 0 20px;
    }
    .year-display {
      font-size: 1.4rem;
      font-weight: 700;
      font-mono: monospace;
      min-width: 65px;
      color: var(--accent);
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .play-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .play-btn:hover { opacity: 0.9; }

    /* Main Container */
    .main-content { display: flex; flex-grow: 1; relative; height: calc(100vh - 61px); }
    #map { flex-grow: 1; background: #0f172a; height: 100%; }

    /* Sidebar / Overlay UI */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 900;
    }
    .sidebar-section { padding: 15px; border-bottom: 1px solid var(--border); }
    .sidebar-section h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px; }

    .filter-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    .filter-item { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .filter-label { display: flex; align-items: center; gap: 8px; }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

    /* Freeze Mode Banner */
    .freeze-banner {
      background: #7c3aed;
      color: white;
      padding: 10px 15px;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      justify-content: space-between;
    }
    .freeze-banner.active { display: flex; }
    .unfreeze-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; }

    /* Custom SVG Markers */
    .nws-marker { transition: all 0.2s ease; }
    .nws-marker:hover { transform: scale(1.3); z-index: 1000 !important; }
    .marker-faded { opacity: 0.25; filter: grayscale(80%); }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper { background: var(--panel-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
    .leaflet-popup-tip { background: var(--panel-bg); }
    .popup-title { font-weight: bold; font-size: 1rem; color: #fff; margin-bottom: 4px; }
    .popup-type { font-size: 0.8rem; font-weight: 600; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .popup-dates { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
    .lineage-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>NWS Field Office Historical Mapper</h1>
      <p>1870 &ndash; Present Station Chronology</p>
    </div>

    <div class="timeline-container">
      <button class="play-btn" id="playBtn">Play</button>
      <input type="range" id="yearSlider" min="1870" max="2026" value="1890" step="1">
      <div class="year-display" id="yearDisplay">1890</div>
    </div>
  </header>

  <div class="freeze-banner" id="freezeBanner">
    <span>🔒 <strong>Lineage Lock Active:</strong> Timeline frozen to show full station history across time.</span>
    <button class="unfreeze-btn" id="unfreezeBtn">Resume Timeline</button>
  </div>

  <div class="main-content">
    <div id="map"></div>

    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Station Field Types</h3>
        <ul class="filter-list" id="typeFilters">
          <!-- Populated by JS -->
        </ul>
      </div>

      <div class="sidebar-section" style="flex-grow:1; overflow-y:auto;">
        <h3>Station Group Details</h3>
        <div id="groupInfo" style="font-size: 0.85rem; color: var(--text-muted);">
          Select a marker on the map to view facility chronology and history.
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -------------------------------------------------------------
    // 1. Station Type Taxonomy & Color Schemes (Categorized visually)
    // -------------------------------------------------------------
    const STATION_TYPES = {
      // [Forecast Offices] -> Blues / Cyan
      "Weather Bureau District Forecast Office/Forecast Center": { category: "Forecast", color: "#1d4ed8" },
      "Weather Service Forecast Office (WSFO)":                { category: "Forecast", color: "#2563eb" },
      "Weather Forecast Office (WFO)":                         { category: "Forecast", color: "#0284c7" },

      // [Basic Offices] -> Amber / Yellow / Orange
      "Signal Service Office":                                 { category: "Basic",    color: "#d97706" },
      "Weather Bureau Office (WBO)":                           { category: "Basic",    color: "#f59e0b" },
      "Weather Bureau Airways Station (WBAS)":                 { category: "Basic",    color: "#eab308" },
      "Weather Service Office (WSO)":                          { category: "Basic",    color: "#fbbf24" },

      // [Specialty Offices] -> Greens / Teals
      "Agricultural Service Office/Agricultural Weather Service Center": { category: "Specialty", color: "#059669" },
      "Weather Bureau-Fire Weather Office":                              { category: "Specialty", color: "#10b981" },
      "WSO-Agricultural":                                                { category: "Specialty", color: "#34d399" },
      "WSO-Fire Weather":                                                { category: "Specialty", color: "#4ade80" },
      "WSO-Forestry":                                                    { category: "Specialty", color: "#86efac" },

      // [Data Collection] -> Purples / Pinks
      "Weather Bureau Meteorological Observatory (WBMO)":       { category: "Data",     color: "#7c3aed" },
      "Weather Service Meteorological Observatory (WSMO)":      { category: "Data",     color: "#8b5cf6" },
      "Weather Service Contract Meteorological Observatory (WSCMO)": { category: "Data", color: "#a855f7" },
      "Data Collection Office (DCO)":                           { category: "Data",     color: "#c084fc" }
    };

    // -------------------------------------------------------------
    // 2. Sample Dataset with Group IDs (Location Lineages)
    // -------------------------------------------------------------
    const sampleData = [
      // Vicksburg, MS Lineage Group (groupId: "vicksburg-ms")
      {
        id: "vks-1",
        groupId: "vicksburg-ms",
        groupName: "Vicksburg Station Lineage",
        name: "Vicksburg Signal Service Office",
        type: "Signal Service Office",
        lat: 32.3526, lon: -90.8779,
        startYear: 1871, endYear: 1891,
        address: "Custom House / Post Office, Vicksburg, MS"
      },
      {
        id: "vks-2",
        groupId: "vicksburg-ms",
        groupName: "Vicksburg Station Lineage",
        name: "Vicksburg Weather Bureau Office",
        type: "Weather Bureau Office (WBO)",
        lat: 32.3515, lon: -90.8785,
        startYear: 1891, endYear: 1965,
        address: "First National Bank Bldg, Vicksburg, MS"
      },
      {
        id: "vks-3",
        groupId: "vicksburg-ms",
        groupName: "Vicksburg Station Lineage",
        name: "Vicksburg WSO",
        type: "Weather Service Office (WSO)",
        lat: 32.3300, lon: -90.8500,
        startYear: 1965, endYear: 1996,
        address: "Vicksburg Airport, MS"
      },

      // Jackson / JAN WFO Lineage Group (groupId: "jackson-ms")
      {
        id: "jan-1",
        groupId: "jackson-ms",
        groupName: "Jackson Station Lineage",
        name: "Jackson Weather Bureau Office",
        type: "Weather Bureau Office (WBO)",
        lat: 32.2988, lon: -90.1848,
        startYear: 1909, endYear: 1963,
        address: "Old Federal Bldg, Jackson, MS"
      },
      {
        id: "jan-2",
        groupId: "jackson-ms",
        groupName: "Jackson Station Lineage",
        name: "Jackson WSFO",
        type: "Weather Service Forecast Office (WSFO)",
        lat: 32.3200, lon: -90.0780,
        startYear: 1963, endYear: 1998,
        address: "Allen C. Thompson Field, Jackson, MS"
      },
      {
        id: "jan-3",
        groupId: "jackson-ms",
        groupName: "Jackson Station Lineage",
        name: "Jackson WFO",
        type: "Weather Forecast Office (WFO)",
        lat: 32.3210, lon: -90.0770,
        startYear: 1998, endYear: 2026,
        address: "E. Metro Pkwy, Flowood / Jackson, MS"
      }
    ];

    // -------------------------------------------------------------
    // 3. Application State & Map Initialization
    // -------------------------------------------------------------
    let activeGroupId = null; // When set, freezes timeline & isolates station group
    let isPlaying = false;
    let playInterval = null;

    // Initialize Map with ESRI Dark Gray Tiles (NO API KEY REQUIRED)
    const map = L.map('map', { zoomControl: true }).setView([32.3, -90.5], 8);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16
    }).addTo(map);

    // Optional Reference Overlay for labels
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      attribution: '',
      maxZoom: 16
    }).addTo(map);

    const markerLayerGroup = L.layerGroup().addTo(map);

    // -------------------------------------------------------------
    // 4. Custom Marker Generation
    // -------------------------------------------------------------
    function createCustomIcon(color, isGroupActive = false) {
      const size = isGroupActive ? 18 : 14;
      const border = isGroupActive ? '3px solid #ffffff' : '2px solid rgba(255,255,255,0.8)';
      const shadow = isGroupActive ? '0 0 10px ' + color : '0 2px 4px rgba(0,0,0,0.5)';

      return L.divIcon({
        className: 'nws-marker',
        html: `<div style="
          background-color: ${color};
          width: ${size}px;
          height: ${size}px;
          border-radius: 50%;
          border: ${border};
          box-shadow: ${shadow};
        "></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    // -------------------------------------------------------------
    // 5. Dynamic Map Rendering Logic
    // -------------------------------------------------------------
    function renderMap() {
      markerLayerGroup.clearLayers();
      const currentYear = parseInt(document.getElementById('yearSlider').value);

      sampleData.forEach(station => {
        const typeInfo = STATION_TYPES[station.type] || { color: '#94a3b8' };
        
        // Mode A: Group Lineage Freeze Mode
        if (activeGroupId !== null) {
          if (station.groupId === activeGroupId) {
            // Plot ALL stations in this group regardless of year
            const icon = createCustomIcon(typeInfo.color, true);
            const marker = L.marker([station.lat, station.lon], { icon }).addTo(markerLayerGroup);
            
            marker.bindPopup(`
              <div class="popup-title">${station.name}</div>
              <div class="popup-type" style="color:${typeInfo.color}">${station.type}</div>
              <div class="popup-dates">Active: ${station.startYear} &ndash; ${station.endYear}</div>
              <div>${station.address}</div>
            `);
          }
        } 
        // Mode B: Timeline Year Mode
        else {
          if (currentYear >= station.startYear && currentYear <= station.endYear) {
            const icon = createCustomIcon(typeInfo.color, false);
            const marker = L.marker([station.lat, station.lon], { icon }).addTo(markerLayerGroup);
            
            marker.bindPopup(`
              <div class="popup-title">${station.name}</div>
              <div class="popup-type" style="color:${typeInfo.color}">${station.type}</div>
              <div class="popup-dates">Active: ${station.startYear} &ndash; ${station.endYear}</div>
              <p style="font-size:0.8rem; margin-bottom:8px;">${station.address}</p>
              <button class="lineage-btn" onclick="lockGroupLineage('${station.groupId}')">
                🔒 Freeze Map & View Full Lineage
              </button>
            `);
          }
        }
      });
    }

    // -------------------------------------------------------------
    // 6. Station Lineage Lock Handler
    // -------------------------------------------------------------
    window.lockGroupLineage = function(groupId) {
      activeGroupId = groupId;
      
      // Stop animation if playing
      if (isPlaying) togglePlay();

      // Show Banner
      document.getElementById('freezeBanner').classList.add('active');

      // Populate Sidebar Lineage Info
      const groupStations = sampleData
        .filter(s => s.groupId === groupId)
        .sort((a,b) => a.startYear - b.startYear);

      let html = `<h4 style="color:#fff; margin-bottom:8px;">${groupStations[0].groupName}</h4>`;
      html += `<p style="font-size:0.75rem; margin-bottom:12px;">Displaying all historical iterations for this station lineage across all years.</p>`;
      
      groupStations.forEach(s => {
        const typeInfo = STATION_TYPES[s.type] || { color: '#94a3b8' };
        html += `
          <div style="background:#121824; padding:8px; border-radius:4px; margin-bottom:8px; border-left:4px solid ${typeInfo.color}">
            <div style="font-weight:bold; color:#fff;">${s.name}</div>
            <div style="font-size:0.75rem; color:${typeInfo.color};">${s.type}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.startYear} &ndash; ${s.endYear}</div>
          </div>
        `;
      });

      document.getElementById('groupInfo').innerHTML = html;
      renderMap();
    };

    document.getElementById('unfreezeBtn').addEventListener('click', () => {
      activeGroupId = null;
      document.getElementById('freezeBanner').classList.remove('active');
      document.getElementById('groupInfo').innerHTML = 'Select a marker on the map to view facility chronology and history.';
      renderMap();
    });

    // -------------------------------------------------------------
    // 7. Timeline Controls & Legend Generation
    // -------------------------------------------------------------
    const yearSlider = document.getElementById('yearSlider');
    const yearDisplay = document.getElementById('yearDisplay');
    const playBtn = document.getElementById('playBtn');

    yearSlider.addEventListener('input', (e) => {
      if (activeGroupId !== null) {
        // If slider is moved while frozen, auto-unfreeze
        activeGroupId = null;
        document.getElementById('freezeBanner').classList.remove('active');
      }
      yearDisplay.textContent = e.target.value;
      renderMap();
    });

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? "Pause" : "Play";
      
      if (isPlaying) {
        playInterval = setInterval(() => {
          let curr = parseInt(yearSlider.value);
          if (curr >= parseInt(yearSlider.max)) curr = parseInt(yearSlider.min);
          else curr++;
          
          yearSlider.value = curr;
          yearDisplay.textContent = curr;
          renderMap();
        }, 300);
      } else {
        clearInterval(playInterval);
      }
    }
    playBtn.addEventListener('click', togglePlay);

    // Build Sidebar Filters / Legend
    const filterList = document.getElementById('typeFilters');
    Object.entries(STATION_TYPES).forEach(([typeName, meta]) => {
      const li = document.createElement('li');
      li.className = 'filter-item';
      li.innerHTML = `
        <span class="filter-label">
          <span class="color-dot" style="background-color:${meta.color}"></span>
          ${typeName}
        </span>
      `;
      filterList.appendChild(li);
    });

    // Initial Render
    renderMap();
  </script>
</body>
</html>
